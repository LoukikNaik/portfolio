name: Deploy portfolio and resume

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
        env:
          CI: false

      - name: Set Custom Domain
        run: echo "loukik.dev" > ./build/CNAME

      - name: Copy index.html to 404.html for SPA routing
        run: cp ./build/index.html ./build/404.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages

  deploy-resume:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: resume-pages-production
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare PDF site
        run: |
          mkdir -p resume-site
          cp src/assets/Loukik_resume.pdf resume-site/resume.pdf
          printf '/ /resume.pdf 200\n' > resume-site/_redirects
          printf '/*\n  Content-Disposition: inline; filename="Loukik_Naik_Resume.pdf"\n' > resume-site/_headers

      # Create the loukik-resume Pages project (production branch: main)
      # and attach resume.loukik.dev in its Custom domains settings first.
      - name: Deploy PDF to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy resume-site --project-name=loukik-resume --branch=main
