name: Verify saved Cloudflare secret
on:
  push:
    branches: [test/cloudflare-secret-1789341680]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check stored token against Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'CHECK'
          import json, os, urllib.request, urllib.error
          token = os.environ['CLOUDFLARE_API_TOKEN']
          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          if not token or not account:
              raise SystemExit('FAIL: required GitHub secret is empty')
          request = urllib.request.Request(
              f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects',
              headers={'Authorization': 'Bearer ' + token})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit(f'FAIL: Cloudflare returned HTTP {error.code}')
          if not data.get('success'):
              raise SystemExit('FAIL: Cloudflare rejected the request')
          if not any(p['name'] == 'loukik-resume' for p in data['result']):
              raise SystemExit('FAIL: resume project not found in this account')
          print('PASS: saved GitHub token authenticated successfully and can access loukik-resume.')
          CHECK
